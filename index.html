<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content">
<title>中文 Revision</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23de2910'/><circle cx='11' cy='11' r='4' fill='%23ffde00'/></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#030712;color:#f3f4f6;min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}
#screen-quiz{display:flex;flex-direction:column;justify-content:center;min-height:100vh;min-height:100dvh}
.btn{border:none;cursor:pointer;font-family:inherit;font-size:14px;border-radius:12px;padding:10px 20px;font-weight:600;transition:all .15s}
.btn-primary{background:#ef4444;color:#fff}.btn-primary:hover{background:#f87171}
.btn-secondary{background:#1f2937;color:#d1d5db}.btn-secondary:hover{background:#374151}
.btn-ghost{background:transparent;color:#6b7280;padding:6px 12px}.btn-ghost:hover{color:#d1d5db}
.btn-full{width:100%}.btn-lg{padding:14px 24px;font-size:18px}.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.input{width:100%;background:#111827;border:1px solid #374151;border-radius:12px;padding:12px 16px;color:#f3f4f6;font-size:16px;font-family:inherit;outline:none;transition:border-color .15s}
.input:focus{border-color:#ef4444}.input::placeholder{color:#4b5563}
.stars{display:inline-flex;gap:2px}.star{font-size:14px}.star-1{color:#fbbf24}.star-2{color:#f97316}.star-3{color:#22d3ee}.star-empty{color:#4b5563}
.progress-bar{width:100%;background:#1f2937;border-radius:999px;overflow:hidden}
.progress-bar-sm{height:6px}.progress-bar-xs{height:4px}
.progress-fill{height:100%;background:#ef4444;border-radius:999px;transition:width .5s}
.menu-title{text-align:center;padding-top:16px;margin-bottom:24px}
.menu-title h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
.menu-title .accent{color:#f87171}
.menu-title .subtitle{color:#6b7280;font-size:13px;margin-top:4px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.section-label{font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.cat-btn{background:#111827;border:1px solid #1f2937;border-radius:10px;padding:8px;cursor:pointer;text-align:left;transition:all .15s;color:#9ca3af}
.cat-btn:hover{border-color:#374151}
.cat-btn.selected{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5}
.cat-btn .cat-icon{font-size:18px;margin-bottom:2px}
.cat-btn .cat-name{font-size:13px;font-weight:500;display:block}
.cat-btn .cat-stat{font-size:11px;opacity:.6}
.actions{margin-top:24px;display:flex;flex-direction:column;gap:8px}
.actions-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.quiz-top .back{font-size:13px;color:#6b7280;cursor:pointer;background:none;border:none;font-family:inherit}
.quiz-top .back:hover{color:#d1d5db}
.quiz-top .stats{font-size:13px;color:#6b7280}
.info-btn{background:none;border:1px solid #374151;border-radius:50%;width:24px;height:24px;font-size:13px;color:#6b7280;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit;line-height:1}
.info-btn:hover{border-color:#6b7280;color:#d1d5db}
.quiz-card{border-radius:16px;padding:10px 16px;text-align:center;margin:6px 0;transition:all .3s;border:2px solid #1f2937;background:#111827}
@media(min-height:700px){.quiz-card{padding:20px 24px;margin:12px 0}}
.quiz-card.correct{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.4)}
.quiz-card.tier-up{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.4);box-shadow:0 0 16px rgba(251,191,36,.1)}
.quiz-card.mastered{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.5);box-shadow:0 0 20px rgba(34,211,238,.15)}
.quiz-card.wrong{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.4)}
.quiz-cat{font-size:11px;color:#4b5563;margin-bottom:4px;display:block}
.quiz-hint-area{height:20px;margin-bottom:2px}
.quiz-furigana{color:#fca5a5;font-size:18px;font-family:'Noto Sans SC',sans-serif}
.quiz-japanese{font-size:40px;font-weight:700;margin-bottom:4px;font-family:'Noto Sans SC',sans-serif;letter-spacing:.02em;line-height:1.1}
.quiz-japanese.char-mode{font-size:64px;margin-bottom:2px}
.romaji-hint{font-size:13px;color:#4b5563;letter-spacing:.05em;margin-bottom:12px;height:18px}
.hint-btn{font-size:12px;color:#6b7280;border:1px solid #374151;border-radius:8px;padding:4px 12px;background:transparent;cursor:pointer;transition:color .15s}
.hint-btn:hover{color:#d1d5db}
.spacer-hint{height:8px}
.speak-btn{background:none;border:1px solid #374151;border-radius:8px;color:#9ca3af;cursor:pointer;font-size:16px;padding:2px 12px;margin-bottom:4px;transition:all .15s}
.speak-btn:hover{border-color:#6b7280;color:#f3f4f6}
.speak-btn-sm{background:none;border:none;color:#4b5563;cursor:pointer;font-size:13px;padding:2px 4px;transition:color .15s}
.speak-btn-sm:hover{color:#f3f4f6}
.feedback-correct{color:#34d399;font-size:20px;font-weight:700;margin-bottom:8px}
.feedback-wrong{color:#f87171;font-size:20px;font-weight:700;margin-bottom:8px}
.feedback-answers{color:#9ca3af;font-size:14px}
.feedback-answers .highlight{color:#fcd34d}
.feedback-typed{color:#6b7280;font-size:12px;margin-top:4px}
.input-row{display:flex;gap:8px}
.input-row .input{flex:1;border-radius:12px}
.input-row .btn{border-radius:12px;padding:12px 20px}
.done-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.done-emoji{font-size:56px;margin-bottom:16px}
.done-title{font-size:24px;font-weight:700;margin-bottom:8px}
.done-stat{color:#9ca3af;margin-bottom:2px}
.done-pct{color:#6b7280;font-size:13px;margin-bottom:24px}
.done-actions{display:flex;flex-direction:column;gap:8px;width:260px}
.add-form{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.field-label{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.add-msg{font-size:13px;margin-top:4px}.add-msg.error{color:#f87171}.add-msg.success{color:#34d399}
.custom-list{display:flex;flex-direction:column;gap:4px}
.custom-item{display:flex;align-items:center;justify-content:space-between;background:#111827;border-radius:8px;padding:8px 12px}
.custom-item-text{font-size:14px}.custom-item-text .jp{font-weight:500}
.custom-item-text .furi{color:#6b7280;font-size:12px;margin-left:6px}
.custom-item-text .en{color:#9ca3af;font-size:13px;margin-left:8px}
.delete-btn{background:none;border:none;color:#4b5563;cursor:pointer;font-size:14px;padding:4px 8px}
.delete-btn:hover{color:#f87171}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;border:1px solid #1f2937;background:#111827;color:#6b7280;transition:all .15s;font-family:inherit}
.filter-btn.active{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5}
.browse-top{position:sticky;top:0;background:#030712;z-index:10;padding:8px 0 4px 0}
.browse-back{font-size:13px;color:#6b7280;cursor:pointer;background:none;border:1px solid #374151;border-radius:20px;font-family:inherit;padding:6px 14px;transition:all .15s;margin-bottom:8px}
.browse-back:hover{color:#d1d5db;border-color:#6b7280}
.cat-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1f2937}
.cat-nav-btn{font-size:11px;padding:4px 8px;border-radius:6px;cursor:pointer;border:1px solid #1f2937;background:#111827;color:#6b7280;transition:all .15s;font-family:inherit;white-space:nowrap}
.cat-nav-btn:hover{border-color:#374151;color:#d1d5db}
.browse-group-label{font-size:11px;color:#4b5563;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;margin-top:12px;padding:4px 0;scroll-margin-top:240px}
.browse-item{display:flex;align-items:center;justify-content:space-between;background:rgba(17,24,39,.5);border-radius:6px;padding:6px 12px;margin-bottom:2px;font-size:13px}
.browse-item .jp{font-weight:500}.browse-item .furi{color:#4b5563;font-size:11px;margin-left:6px}.browse-item .en{color:#6b7280;margin-left:8px}
.edit-btn{background:none;border:none;color:#4b5563;cursor:pointer;font-size:13px;padding:2px 6px;margin-left:4px;transition:color .15s}
.edit-btn:hover{color:#fbbf24}
.edit-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.edit-modal{background:#111827;border:1px solid #374151;border-radius:16px;padding:24px;max-width:420px;width:100%}
.edit-modal h3{font-size:18px;font-weight:700;margin-bottom:4px}
.edit-modal .edit-jp{color:#fca5a5;font-size:14px;margin-bottom:16px;font-family:'Noto Sans SC',sans-serif}
.edit-modal .edit-actions{display:flex;gap:8px;margin-top:16px}
.edit-modal .edit-actions .btn{flex:1}
.screen-title{font-size:20px;font-weight:700;margin-bottom:12px}
.volume-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 12px;background:#111827;border-radius:10px}
.volume-icon{cursor:pointer;font-size:18px;user-select:none;line-height:1}
.volume-slider{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#374151;outline:none}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#ef4444;cursor:pointer;border:none}
.volume-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#ef4444;cursor:pointer;border:none}
.streak-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#111827;border-radius:10px;margin-bottom:12px}
.mode-btn{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:500;cursor:pointer;color:#d1d5db;font-family:inherit;transition:all .15s;text-align:center}
.mode-btn.active{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#fca5a5}
.len-btn{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;color:#d1d5db;font-family:inherit;transition:all .15s}
.len-btn.active{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#fca5a5}
.choice-btn{background:#1f2937;border:1px solid #374151;border-radius:10px;padding:12px 8px;font-size:14px;cursor:pointer;color:#d1d5db;font-family:inherit;transition:all .15s;text-align:center}
.choice-btn:hover:not(:disabled){background:#374151}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app" id="app">
<div id="screen-menu">
<div class="menu-title"><h1><span class="accent">中文</span> Revision</h1><p class="subtitle" id="menu-mastered-text"></p><div class="progress-bar progress-bar-sm" style="margin-top:8px"><div class="progress-fill" id="menu-progress-fill"></div></div></div>
<div class="streak-bar" id="streak-bar"></div>
<div class="section-header"><span class="section-label">Lessons</span><div><button class="btn-ghost btn-sm" onclick="selectAllLessons()">All</button><button class="btn-ghost btn-sm" onclick="selectNoLessons()">None</button></div></div>
<div class="cat-grid" id="cat-grid"></div>
<div class="actions">
<button class="btn btn-primary btn-full btn-lg" id="start-quiz-btn" onclick="openQuizModal()">Start Quiz</button>
<button class="btn btn-secondary btn-full" onclick="openWeakQuiz()" style="border-color:rgba(251,191,36,.4);color:#fbbf24">🎯 Practise Weak &amp; Unseen Words</button>
<div class="actions-row"><button class="btn btn-secondary btn-full" onclick="showScreen('browse')">Browse &amp; Edit Words</button><button class="btn btn-secondary btn-full" onclick="showScreen('add')">Add Words</button></div>
<div class="actions-row" style="margin-top:4px"><button class="btn btn-secondary btn-full" onclick="openStats()">📊 Stats</button><button class="btn btn-secondary btn-full" onclick="openSettings()">⚙️ Settings</button></div>
<div class="actions-row" style="margin-top:4px"><button class="btn btn-secondary btn-full btn-sm" onclick="exportData()">Export Data</button><button class="btn btn-secondary btn-full btn-sm" onclick="document.getElementById('import-file').click()">Import Data</button><input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)"></div>
<button class="btn btn-ghost btn-full" style="font-size:13px;color:#6b7280;margin-top:4px" onclick="resetProgress()">Reset Progress</button>
</div></div>

<div id="screen-quiz" class="hidden">
<div class="quiz-top"><button class="back" onclick="showScreen('menu')">&#8592; Back</button><span class="stats" id="quiz-stats"></span><button class="info-btn" onclick="showQuizInfo()" title="How scoring works">ℹ</button></div>
<div class="progress-bar progress-bar-xs" style="margin-bottom:4px"><div class="progress-fill" id="quiz-progress-fill"></div></div>
<div id="quiz-card" class="quiz-card"></div>
</div>

<div id="screen-done" class="hidden done-screen"><div class="done-emoji">&#127881;</div><div class="done-title">Session Complete</div><p class="done-stat" id="done-stat"></p><p class="done-pct" id="done-pct"></p><div class="done-actions"><button class="btn btn-primary btn-full" onclick="startQuiz()">Go Again</button><button class="btn btn-ghost btn-full" onclick="showScreen('menu')">Back to Menu</button></div></div>

<div id="screen-add" class="hidden">
<button class="browse-back" onclick="showScreen('menu')">&#8592; Back</button>
<div class="screen-title">Add Custom Words</div>
<div class="add-form"><div><div class="field-label">Chinese (Hanzi)</div><input class="input" id="add-japanese" placeholder="e.g. 你好"></div><div><div class="field-label">Pinyin (optional)</div><input class="input" id="add-furigana" placeholder="e.g. nǐ hǎo"></div><div><div class="field-label">English (semicolon-separated)</div><input class="input" id="add-english" placeholder="e.g. hello; hi" onkeydown="if(event.key==='Enter')addWord()"></div><button class="btn btn-primary btn-full" onclick="addWord()">Add Word</button><div class="add-msg hidden" id="add-msg"></div></div>
<div id="custom-list-section" class="hidden"><div class="section-label" style="margin-bottom:8px" id="custom-list-label"></div><div class="custom-list" id="custom-list"></div></div></div>

<div id="screen-browse" class="hidden">
<div class="browse-top"><button class="browse-back" onclick="showScreen('menu')">&#8592; Back</button><input class="input" id="browse-search" placeholder="Search words..." oninput="renderBrowse()" style="margin-bottom:8px;font-size:14px;padding:10px 14px"><div class="filter-row" id="browse-filters"></div><div class="cat-nav" id="cat-nav"></div></div>
<div id="browse-list"></div></div>
</div>
<script>

// ============ SRS ============
function getSRS(id){
  try{const d=JSON.parse(localStorage.getItem(STORAGE.srs)||"{}");return d[id]||{level:0,nextReview:0}}catch{return{level:0,nextReview:0}}
}
function saveSRS(id,data){
  try{const d=JSON.parse(localStorage.getItem(STORAGE.srs)||"{}");d[id]=data;localStorage.setItem(STORAGE.srs,JSON.stringify(d))}catch{}
}
function resetSRSStorage(){localStorage.setItem(STORAGE.srs,"{}")}
function isDueForReview(id){const s=getSRS(id);return s.nextReview>0&&s.nextReview<=Date.now()}
function advanceSRS(id){
  const s=getSRS(id);const nextLevel=Math.min(s.level+1,SRS_INTERVALS.length-1);
  const nextReview=Date.now()+(SRS_INTERVALS[nextLevel]*24*60*60*1000);
  saveSRS(id,{level:nextLevel,nextReview});
}
function failSRS(id){saveSRS(id,{level:0,nextReview:Date.now()+(60*60*1000)})} // 1hr
function getDueWords(){return getAllWords().filter(w=>getStars(w.id)>=9&&isDueForReview(w.id))}
function getReviewSchedule(id){
  const s=getSRS(id);const now=Date.now();
  if(s.nextReview<=now)return"Due now";
  const diff=s.nextReview-now;const days=Math.ceil(diff/(24*60*60*1000));
  if(days===1)return"Due tomorrow";return"Due in "+days+" days";
}

// ============ STREAK ============
function getStreak(){
  try{return JSON.parse(localStorage.getItem(STORAGE.streak)||'{"count":0,"lastDate":""}')}catch{return{count:0,lastDate:""}}
}
function updateStreak(){
  const d=new Date();const today=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const s=getStreak();
  if(s.lastDate===today)return s;
  const yd=new Date(Date.now()-86400000);const yesterday=yd.getFullYear()+'-'+String(yd.getMonth()+1).padStart(2,'0')+'-'+String(yd.getDate()).padStart(2,'0');
  const newCount=s.lastDate===yesterday?s.count+1:1;
  const newS={count:newCount,lastDate:today};
  localStorage.setItem(STORAGE.streak,JSON.stringify(newS));
  return newS;
}

// ============ DIFFICULT WORDS ============
function getWrongCount(id){return(progress[id]&&progress[id].wrongCount)||0}
function getDifficultWords(){return getAllWords().filter(w=>getWrongCount(w.id)>=3)}
// Weak = not mastered AND (got wrong at least once and still under 6 stars, OR wrong 3+ times)
function isWeak(w){const s=getStars(w.id),wc=getWrongCount(w.id);return s<9&&((wc>=1&&s<6)||wc>=3)}
function isUnseen(w){return !(w.id in progress)}
function getWeakWords(){return getAllWords().filter(isWeak)}
function getUnseenWords(){return getAllWords().filter(isUnseen)}
function inScope(w){return selectedLessons.size===0||selectedLessons.has(w.lesson)}
function openWeakQuiz(){
  const wk=getWeakWords().filter(inScope).length,un=getUnseenWords().filter(inScope).length;
  if(wk===0&&un===0){alert('Nothing weak or unseen in the selected lessons yet — do a quiz first, or pick different lessons.');return}
  sessionLimit=wk>0?-4:-5;openQuizModal();
}

let audioCtx=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function vs(base){return base*volume}
function playTone(freq,dur,type,vol,delay){if(volume===0)return;const ctx=getAudioCtx(),t=ctx.currentTime+(delay||0),o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vs(vol||.15),t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur)}
function playClick(){if(volume===0)return;const ctx=getAudioCtx(),t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(800,t);o.frequency.exponentialRampToValueAtTime(400,t+.04);g.gain.setValueAtTime(vs(.08),t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.06)}
function playCorrect(){playTone(523,.12,'sine',.15,0);playTone(659,.12,'sine',.15,.08);playTone(784,.2,'sine',.12,.16)}

function starsHTML(totalStars){
  // 0-9 stars across 3 tiers of 3
  const tier=totalStars<3?0:totalStars<6?1:totalStars<9?2:2;
  const starsInTier=totalStars%3; // 0,1,2 within tier (9 shows as full tier 2)
  const filledInTier=totalStars===9?3:starsInTier;
  const tierCls=['star-1','star-2','star-3'][tier];
  let h='<span class="stars">';
  for(let i=0;i<3;i++){
    h+='<span class="star '+(i<filledInTier?tierCls:'star-empty')+'">'+(i<filledInTier?'★':'☆')+'</span>';
  }
  // Show tier indicator dots
  if(totalStars>=3){
    const tierDots=['','🟠','💎'][tier];
    h+='<span style="font-size:10px;margin-left:3px">'+tierDots+'</span>';
  }
  return h+'</span>';
}

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function ansVariants(s){
  s=String(s).replace(/[\u00a0\u200b-\u200d\ufeff\u202f\u2000-\u200a]/g,' ').toLowerCase().replace(/[\u2018\u2019`\u00b4]/g,"'");
  const stripD=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const noParen=s.replace(/\([^)]*\)/g,' ');
  const out=new Set();
  [s,noParen,stripD(s),stripD(noParen)].forEach(t=>{
    const b=t.replace(/[^\p{L}\p{N}\s']/gu,' ').replace(/\s+/g,' ').trim();
    if(!b)return;
    out.add(b);
    out.add(b.replace(/^(to|a|an|the)\s+/,''));   // "to eat" ~ "eat"
    out.add(b.replace(/[\s']/g,''));               // ignore spaces / apostrophes
    out.add(b.replace(/^(to|a|an|the)\s+/,'').replace(/[\s']/g,''));
  });
  return out;
}
function matchAnswer(inp,ans){
  const iv=ansVariants(inp);
  return ans.some(a=>{const av=ansVariants(a);for(const v of iv)if(av.has(v))return true;return false});
}

// ============ QUIZ ============
function startQuiz(){
  let pool;
  const activeWords=getActiveWords();
  if(sessionLimit===-1){pool=getDueWords().filter(w=>selectedLessons.size===0||selectedLessons.has(w.lesson));if(pool.length===0){alert('No words due for review in selected categories.');return}}
  else if(sessionLimit===-2){pool=getDifficultWords().filter(w=>selectedLessons.size===0||selectedLessons.has(w.lesson));if(pool.length===0){alert('No difficult words yet. Words appear here after 3+ wrong answers.');return}}
  else if(sessionLimit===-4){pool=getWeakWords().filter(inScope);if(pool.length===0){alert('No weak words in the selected lessons right now.');return}}
  else if(sessionLimit===-5){pool=getUnseenWords().filter(inScope);if(pool.length===0){alert('Every word in the selected lessons has been seen.');return}}
  else{const needWork=activeWords.filter(w=>getStars(w.id)<9);pool=needWork.length>0?needWork:activeWords}

  // Sort: unseen first, then fewer stars, shuffle within groups
  const grouped={};
  pool.forEach(w=>{
    const s=getStars(w.id);
    const key=s===0&&getWrongCount(w.id)===0?'new':String(s);
    if(!grouped[key])grouped[key]=[];
    grouped[key].push(w);
  });
  const order=['new','0','1','2','3','4','5','6','7','8'];
  const sorted=[];
  order.forEach(k=>{if(grouped[k])sorted.push(...shuffle(grouped[k]))});

  // Apply session limit (for finite modes, limit the initial pool)
  const initialPool=(sessionLimit>0)?sorted.slice(0,sessionLimit):
                    (sessionLimit===-3)?shuffle([...sorted]):sorted;

  // Reset session state
  sessionBuckets={};
  initialPool.forEach(w=>{sessionBuckets[w.id]={bucket:0,lastSeen:-99}});

  // Build initial queue - just the pool in order, re-queuing happens dynamically
  quizQueue=[...initialPool];
  quizIdx=0;quizAnswered=0;quizCorrect=0;quizFeedback=null;quizShowHint=false;quizLastInput="";currentStreak=0;lastWrong=null;
  _previewedThisSession.clear();
  updateStreak();
  showScreen('quiz');renderQuiz();
}

// Insert a word back into the queue after the appropriate gap for its bucket level
function requeueWord(w){
  const b=sessionBuckets[w.id];
  if(!b)return -1;
  const gap=SESSION_GAPS[Math.min(b.bucket,SESSION_GAPS.length-1)];
  // Add some randomness: insert at gap ± 30%
  const jitter=Math.floor(gap*0.3);
  const insertAfter=gap+Math.floor(Math.random()*jitter*2)-jitter;
  const insertAt=Math.min(quizIdx+1+Math.max(1,insertAfter),quizQueue.length);
  quizQueue.splice(insertAt,0,w);
  b.lastSeen=quizIdx;
  return insertAt;
}

function startTimer(){
  if(!timedMode)return;

  renderTimerBar();
  if(timerInterval)clearInterval(timerInterval);

    renderTimerBar();
    if(timerLeft<=3)playTimerWarn();
    if(timerLeft<=0){clearInterval(timerInterval);timerInterval=null;timeUp()}
  },1000);
}

  failSRS(w.id);

function buildChoices(correct){
  const all=getAllWords();
  const pool=correct.lesson==='custom'
    ? all.filter(w=>w.id!==correct.id&&!isCharMode(w))
    : all.filter(w=>w.id!==correct.id&&w.lesson===correct.lesson);
  const wrong=shuffle(pool).slice(0,3);
  // If not enough in category, pad with random from anywhere
  if(wrong.length<3){
    const extras=shuffle(all.filter(w=>w.id!==correct.id&&!wrong.find(x=>x.id===w.id)&&!isCharMode(w))).slice(0,3-wrong.length);
    wrong.push(...extras);
  }
  return shuffle([correct,...wrong]);
}

function submitChoice(chosenId,correctId){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  const w=quizQueue[quizIdx];
  quizLastInput=getAllWords().find(x=>x.id===chosenId)?.english[0]||'';
  quizAnswered++;
  const isCorrect=chosenId===correctId;
  if(isCorrect){
    quizCorrect++;quizFeedback='correct';_feedbackShownAt=Date.now();currentStreak++;recordCorrect();
    const wc=getWrongCount(w.id);
    const justPrev=_justPreviewed.has(w.id);
    if(justPrev)_justPreviewed.delete(w.id);
    const sb=sessionBuckets[w.id]||(sessionBuckets[w.id]={bucket:0,lastSeen:-99});
    if(!justPrev)sb.bucket=Math.min(sb.bucket+1,SESSION_GAPS.length);
    if(sb.bucket<SESSION_GAPS.length){requeueWord(w)}
    if(!justPrev&&sb.bucket>=SESSION_GAPS.length){
      const ns=Math.min(9,getStars(w.id)+1);
      progress[w.id]={stars:ns,wrongCount:wc};saveProgress();
      if(ns===9){advanceSRS(w.id);playThreeStars()}
      else if(ns===3||ns===6){playThreeStars()}
      else if(ns===1)playOneStar();
      else playCorrect();
    } else {
      progress[w.id]={stars:getStars(w.id),wrongCount:wc};saveProgress();
      playCorrect();
    }
    if(sessionLimit===-3&&sb.bucket>=SESSION_GAPS.length){sb.bucket=0;quizQueue.push(w)}
  } else {
    quizFeedback='wrong';_feedbackShownAt=Date.now();playWrong();currentStreak=0;recordIncorrect();
    _justPreviewed.delete(w.id);
    const sb=sessionBuckets[w.id]||(sessionBuckets[w.id]={bucket:0,lastSeen:-99});
    sb.bucket=0;
    requeueWord(w);
    const curTier2=Math.floor(getStars(w.id)/3)*3;
    progress[w.id]={stars:curTier2,wrongCount:getWrongCount(w.id)+1};saveProgress();
    failSRS(w.id);
  }
  // Highlight chosen button
  document.querySelectorAll('.choice-btn').forEach(b=>{
    const chosen=b.textContent.trim()===quizLastInput.trim();
    const correct=b.textContent.trim()===w.english[0].trim();
    if(correct)b.style.background='rgba(16,185,129,0.3)';
    else if(chosen&&!isCorrect)b.style.background='rgba(239,68,68,0.3)';
    b.disabled=true;
  });
  setTimeout(()=>{if(!document.getElementById("screen-quiz").classList.contains("hidden")){speakTarget(w.japanese,w.furigana);renderQuiz()}},800);
}

let lastWrong=null; // {snap, at, input} for the "I was right" button
function applyCorrect(w){
  quizCorrect++;quizFeedback='correct';_feedbackShownAt=Date.now();currentStreak++;recordCorrect();
  const wc=getWrongCount(w.id);
  const justPrev=_justPreviewed.has(w.id);
  if(justPrev)_justPreviewed.delete(w.id);
  const sb=sessionBuckets[w.id]||(sessionBuckets[w.id]={bucket:0,lastSeen:-99});
  if(!justPrev)sb.bucket=Math.min(sb.bucket+1,SESSION_GAPS.length);
  if(sb.bucket<SESSION_GAPS.length){requeueWord(w)}
  if(!justPrev&&sb.bucket>=SESSION_GAPS.length){
    const ns=Math.min(9,getStars(w.id)+1);
    progress[w.id]={stars:ns,wrongCount:wc};saveProgress();
    if(ns===9){advanceSRS(w.id);playThreeStars()}
    else if(ns===3||ns===6){playThreeStars()}
    else if(ns===1)playOneStar();
    else playCorrect();
  } else {
    progress[w.id]={stars:getStars(w.id),wrongCount:wc};saveProgress();
    playCorrect();
  }
  if(sessionLimit===-3&&sb.bucket>=SESSION_GAPS.length){sb.bucket=0;quizQueue.push(w)}
}
function submitQuiz(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null}
  const el=document.getElementById('quiz-input');if(!el)return;const val=el.value;if(!val.trim())return;
  quizLastInput=val;quizAnswered++;const w=quizQueue[quizIdx];
  // snapshot so a wrong mark can be undone with "I was right"
  const snap={id:w.id,prog:progress[w.id]?{...progress[w.id]}:null,srs:getSRS(w.id),
    bucket:sessionBuckets[w.id]?{...sessionBuckets[w.id]}:null,justPrev:_justPreviewed.has(w.id)};
  const isCorrect=quizMode==='reverse'
    ?matchAnswer(val,[w.japanese,w.furigana].filter(Boolean))
    :matchAnswer(val,w.english);
  if(isCorrect){
    lastWrong=null;applyCorrect(w);
  } else {
    quizFeedback='wrong';_feedbackShownAt=Date.now();playWrong();currentStreak=0;recordIncorrect();
    _justPreviewed.delete(w.id);
    const sb=sessionBuckets[w.id]||(sessionBuckets[w.id]={bucket:0,lastSeen:-99});
    sb.bucket=0;
    const at=requeueWord(w);
    lastWrong={snap,at,input:val};
    const curTier=Math.floor(getStars(w.id)/3)*3;
    progress[w.id]={stars:curTier,wrongCount:getWrongCount(w.id)+1};saveProgress();
    failSRS(w.id);
  }
  speakTarget(w.japanese,w.furigana);renderQuiz();
}
// "I was right": undo the wrong mark and score it as correct
function markRight(remember){
  const lw=lastWrong,w=quizQueue[quizIdx];
  if(!lw||quizFeedback!=='wrong'||!w||w.id!==lw.snap.id)return;
  playClick();
  const s=lw.snap;
  if(s.prog)progress[w.id]=s.prog;else delete progress[w.id];
  saveSRS(w.id,s.srs);
  if(s.bucket)sessionBuckets[w.id]=s.bucket;else delete sessionBuckets[w.id];
  if(lw.at>quizIdx&&quizQueue[lw.at]&&quizQueue[lw.at].id===w.id)quizQueue.splice(lw.at,1);
  const ls=getLifetimeStats();ls.incorrect=Math.max(0,ls.incorrect-1);saveLifetimeStats(ls);
  if(s.justPrev)_justPreviewed.add(w.id);
  if(remember&&quizMode!=='reverse'){
    const typed=lw.input.trim();
    if(typed&&!matchAnswer(typed,w.english)){
      const upd=[...w.english,typed];
      wordOverrides[w.id]=upd;saveOverrides();
      quizQueue.forEach(x=>{if(x.id===w.id)x.english=upd});
    }
  }
  lastWrong=null;
  applyCorrect(w);
  renderQuiz();
}

function renderBrowse(){

  document.getElementById('browse-filters').innerHTML=[
    {key:'all',label:'All ('+all.length+')'},
    {key:'unmastered',label:'Remaining ('+rc+')'},
    {key:'mastered',label:'Mastered ('+mc+')'},
    {key:'due',label:'📅 Due ('+getDueWords().length+')'},
    {key:'difficult',label:'⚠️ Difficult ('+dc+')'},
    {key:'weak',label:'🎯 Weak ('+getWeakWords().length+')'},
    {key:'unseen',label:'🆕 Unseen ('+getUnseenWords().length+')'},
  ].map(f=>'<button class="filter-btn'+(browseFilter===f.key?' active':'')+'" onclick="setBrowseFilter(\''+f.key+'\')">'+f.label+'</button>').join('');
  const filtered=all.filter(w=>{
    if(browseFilter==='mastered')return getStars(w.id)>=9;
    if(browseFilter==='unmastered')return getStars(w.id)<9;
    if(browseFilter==='due')return getStars(w.id)>=9&&isDueForReview(w.id);
    if(browseFilter==='difficult')return getWrongCount(w.id)>=3;
    if(browseFilter==='weak')return isWeak(w);
    if(browseFilter==='unseen')return isUnseen(w);
    return true;
  });
  const searchEl=document.getElementById('browse-search');
  const sq=(searchEl?searchEl.value:'').trim().toLowerCase();
  const searched=sq?filtered.filter(w=>w.japanese.toLowerCase().includes(sq)||(w.furigana&&w.furigana.toLowerCase().includes(sq))||w.english.some(e=>e.toLowerCase().includes(sq))):filtered;
  const grouped={};searched.forEach(w=>{if(!grouped[w.lesson])grouped[w.lesson]=[];grouped[w.lesson].push(w)});
  const activeCats=CAT_ORDER.filter(c=>grouped[c]);
  let nav='';activeCats.forEach(c=>{const info=LESSONS[c]||{name:c,icon:""};nav+='<button class="cat-nav-btn" onclick="document.getElementById(\'browse-cat-'+c+'\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">'+info.icon+' '+info.name+'</button>'});

  let html=sq?'<div style="font-size:12px;color:#6b7280;margin-bottom:8px">'+searched.length+' result'+(searched.length!==1?'s':'')+'</div>':'';

    grouped[l].forEach(w=>{
      const isEdited=!!wordOverrides[w.id];const furi=w.furigana?escapeHTML(w.furigana).replace(/'/g,"\\'"):'';
      const wc=getWrongCount(w.id);const srs=getStars(w.id)>=9?'<span style="color:#6b7280;font-size:10px;margin-left:4px">'+getReviewSchedule(w.id)+'</span>':'';
      const diffTag=wc>=3?'<span style="color:#f87171;font-size:10px;margin-left:4px" title="Wrong '+wc+' times">⚠️</span>':'';
      html+='<div class="browse-item"><div style="flex:1;min-width:0"><span class="jp">'+escapeHTML(w.japanese)+'</span>'+(w.furigana?'<span class="furi">('+escapeHTML(w.furigana)+')</span>':'')+'<span class="en">'+escapeHTML(w.english.join(', '))+'</span>'+(w.example?'<span style="color:#93c5fd;font-size:10px;margin-left:4px" title="'+escapeHTML(w.example)+'">💡</span>':'')+(isEdited?'<span style="color:#fbbf24;font-size:10px;margin-left:4px" title="Edited">✎</span>':'')+diffTag+srs+'</div><button class="speak-btn-sm" onclick="speakTarget(\''+escapeHTML(w.japanese).replace(/'/g,"\\'")+'\',\''+furi+'\')" title="Listen">🔈</button><button class="edit-btn" onclick="editWord(\''+w.id+'\')" title="Edit">✎</button>'+starsHTML(getStars(w.id))+'</div>'});
  });
  document.getElementById('browse-list').innerHTML=html;

function editWord(id){

  const current=wordOverrides[id]||original.english;
  const overlay=document.createElement('div');overlay.className='edit-overlay';
  overlay.innerHTML='<div class="edit-modal"><h3>Edit Answers</h3><div style="font-size:12px;color:#6b7280;margin-bottom:10px">Change how the English is worded. Any of these counts as a correct answer.</div><div class="edit-jp">'+escapeHTML(original.japanese)+(original.furigana?' ('+escapeHTML(original.furigana)+')':'')+'</div><div class="field-label">Answers (semicolon-separated)</div><input class="input" id="edit-english-input" value="'+escapeHTML(current.join('; '))+'"><div class="edit-actions"><button class="btn btn-secondary" id="edit-cancel-btn">Cancel</button>'+(wordOverrides[id]?'<button class="btn btn-ghost" id="edit-reset-btn" style="color:#fbbf24">Reset</button>':'')+'<button class="btn btn-primary" id="edit-save-btn">Save</button></div></div>';
  document.body.appendChild(overlay);
  const inp=document.getElementById('edit-english-input');inp.focus();inp.selectionStart=inp.value.length;
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeEdit()});
  document.getElementById('edit-cancel-btn').addEventListener('click',closeEdit);
  document.getElementById('edit-save-btn').addEventListener('click',()=>{const answers=inp.value.split(';').map(a=>a.trim()).filter(Boolean);if(!answers.length){alert('Enter at least one answer.');return}wordOverrides[id]=answers;saveOverrides();closeEdit();afterEdit()});
  const rb=document.getElementById('edit-reset-btn');if(rb)rb.addEventListener('click',()=>{delete wordOverrides[id];saveOverrides();closeEdit();afterEdit()});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('edit-save-btn').click();if(e.key==='Escape')closeEdit()});
  function closeEdit(){if(overlay.parentNode)overlay.parentNode.removeChild(overlay)}
}

// ============ EXPORT/IMPORT ============
function exportData(){playClick();const data={progress,customWords,overrides:wordOverrides};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;const d=new Date();const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');a.download='chinese-revision-'+ds+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url)}
function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);if(data.customWords&&Array.isArray(data.customWords)){customWords=data.customWords;saveCustom()}if(data.progress&&typeof data.progress==='object'){progress=data.progress;saveProgress()}if(data.overrides&&typeof data.overrides==='object'){wordOverrides=data.overrides;saveOverrides()}renderMenu();alert('Imported successfully.')}catch{alert('Invalid file.')}event.target.value=''};reader.readAsText(file)}

// ============ VOLUME ============
function openSettings(){
  const overlay=document.createElement('div');overlay.className='edit-overlay';
  overlay.innerHTML=`<div class="edit-modal" style="max-width:360px">
    <h3 style="margin-bottom:16px">⚙️ Settings</h3>
    <div style="display:flex;flex-direction:column;gap:14px">
      <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:14px;color:#d1d5db">
        <div>
          <div style="font-weight:600">Show new word card</div>
          <div style="font-size:12px;color:#6b7280;margin-top:2px">Preview meaning before quizzing on new words</div>
        </div>
        <input type="checkbox" id="setting-newcard" style="width:18px;height:18px;cursor:pointer;margin-left:12px" ${showNewWordCard?'checked':''}>
      </label>
      <div>
        <div style="font-size:13px;font-weight:600;color:#d1d5db;margin-bottom:8px">Volume</div>
        <div style="display:flex;align-items:center;gap:10px">
          <span id="settings-vol-icon" onclick="toggleMute();updateSettingsVolIcon()" style="cursor:pointer;font-size:18px">🔊</span>
          <input type="range" min="0" max="100" id="settings-volume-slider" class="volume-slider" style="flex:1" oninput="setVolume(this.value);updateSettingsVolIcon()" value="${Math.round(volume*100)}">
        </div>
      </div>
    </div>
    <div style="margin-top:20px">
      <button class="btn btn-primary btn-full" onclick="saveSettingsModal()">Save</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay){saveSettingsModal();overlay.remove()}});
  updateSettingsVolIcon();
}

function updateSettingsVolIcon(){
  const i=document.getElementById('settings-vol-icon');if(!i)return;
  if(volume===0)i.textContent='🔇';else if(volume<.4)i.textContent='🔈';else if(volume<.75)i.textContent='🔉';else i.textContent='🔊';
  const sl=document.getElementById('settings-volume-slider');if(sl)sl.value=Math.round(volume*100);
}

function saveSettingsModal(){
  const cb=document.getElementById('setting-newcard');
  if(cb)showNewWordCard=cb.checked;
  saveSettings();
  const overlay=document.querySelector('.edit-overlay');if(overlay)overlay.remove();
}

function openStats(){
  const all=getAllWords();
  const tier1=all.filter(w=>getStars(w.id)>=1&&getStars(w.id)<3).length;
  const tier2=all.filter(w=>getStars(w.id)>=3&&getStars(w.id)<6).length;
  const tier3=all.filter(w=>getStars(w.id)>=6&&getStars(w.id)<9).length;
  const mastered=all.filter(w=>getStars(w.id)>=9).length;
  const newLearnt=all.filter(w=>getStars(w.id)>0||(progress[w.id]&&progress[w.id].wrongCount>0)).length;
  const ls=getLifetimeStats();
  const total=ls.correct+ls.incorrect;
  const acc=total>0?Math.round((ls.correct/total)*100):0;
  const overlay=document.createElement('div');overlay.className='edit-overlay';
  overlay.innerHTML=`<div class="edit-modal" style="max-width:360px">
    <h3 style="margin-bottom:16px">📊 Stats</h3>
    <div style="display:flex;flex-direction:column;gap:10px;font-size:14px">
      <div style="background:#0f172a;border-radius:10px;padding:12px 14px">
        <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Word Progress</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="color:#fbbf24">⭐ Yellow tier (1–3 stars)</span><span style="font-weight:700;color:#f3f4f6">${tier1}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="color:#f97316">🟠 Orange tier (4–6 stars)</span><span style="font-weight:700;color:#f3f4f6">${tier2}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="color:#a78bfa">💜 Purple tier (7–8 stars)</span><span style="font-weight:700;color:#f3f4f6">${tier3}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="color:#22d3ee">💎 Mastered (9 stars)</span><span style="font-weight:700;color:#f3f4f6">${mastered}</span>
          </div>
          <div style="border-top:1px solid #1f2937;padding-top:6px;margin-top:2px;display:flex;justify-content:space-between;align-items:center">
            <span style="color:#9ca3af">Total words encountered</span><span style="font-weight:700;color:#f3f4f6">${newLearnt} / ${all.length}</span>
          </div>
        </div>
      </div>
      <div style="background:#0f172a;border-radius:10px;padding:12px 14px">
        <div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Lifetime Answers</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;justify-content:space-between"><span style="color:#34d399">✓ Correct</span><span style="font-weight:700;color:#f3f4f6">${ls.correct.toLocaleString()}</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:#f87171">✗ Incorrect</span><span style="font-weight:700;color:#f3f4f6">${ls.incorrect.toLocaleString()}</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:#9ca3af">Accuracy</span><span style="font-weight:700;color:#f3f4f6">${acc}%</span></div>
        </div>
      </div>
    </div>
    <div style="margin-top:16px">
      <button class="btn btn-secondary btn-full" onclick="this.closest('.edit-overlay').remove()">Close</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});
}function setVolume(val){volume=parseInt(val)/100;localStorage.setItem(STORAGE.volume,volume.toString());updateSettingsVolIcon()}
function toggleMute(){if(volume>0){window._pv=volume;volume=0}else{volume=window._pv||.7}localStorage.setItem(STORAGE.volume,volume.toString());updateVolumeIcon();updateSettingsVolIcon()}
function updateVolumeIcon(){}

// ============ INIT ============
loadStorage();loadSettings();showScreen('menu');

// Shrink quiz card when iOS keyboard appears (visual viewport shrinks)
// Keyboard layout: screen is fixed so content stays put when keyboard opens

</script>
